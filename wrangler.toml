name = "fpl-assistant"
compatibility_date = "2026-01-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

# No database is needed: the app is advisory-only and reads everything live from the
# official FPL API (cached at the Cloudflare edge via the Cache API). Your Team ID and
# League ID live in your browser (localStorage), never on the server.

# AI coaching layer. The /api/coach endpoint uses whichever provider is available:
#   1. Cloudflare Workers AI via the `AI` binding below — free daily allowance on your
#      Cloudflare account, no key or billing required. This is the default.
#   2. Claude, if you set ANTHROPIC_API_KEY as a secret (higher quality, paid):
#        npx wrangler pages secret put ANTHROPIC_API_KEY
# Without either, the app still works fully — only the AI narrative panel is hidden.

[ai]
binding = "AI"
